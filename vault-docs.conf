# vault-docs.conf: i file di documentazione che hivevault-progetti allinea nel vault del
# progetto in HiveVault a ogni commit (file nuovi e cambiati caricati, file tolti cancellati).
# Una regola per riga, come in .gitignore: file singoli, cartelle (docs/), wildcard (*.md,
# docs/**/*.pdf), ! per escludere, # per i commenti. Contano solo i file tracciati da git,
# al massimo 4 MiB ciascuno.
README.md
docs/**/*.md
