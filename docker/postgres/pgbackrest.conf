# pgBackRest for HiveVault. The repository is encrypted (AES-256): the passphrase comes from
# the environment (PGBACKREST_REPO1_CIPHER_PASS), never from this file.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# two full backups and the WAL between them (with a weekly full: about two weeks of recovery)
repo1-retention-full=2
compress-type=zst
compress-level=3
process-max=4
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[brain]
pg1-path=/var/lib/postgresql/data
pg1-user=brain
pg1-database=brain
